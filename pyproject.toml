[project]
name = "ghost-scale-sim"
version = "0.1.0"
description = "A working model of how people work out what someone was trying to do when they made something, and what happens when nothing was."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Abraham Haskins, PhD" }]
dependencies = [
    "inferactively-pymdp==1.0.2", # ships pymdp.legacy; we use the legacy NumPy API only
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "pyyaml",
    "seaborn",
    "pytest",
]

# Non-negotiable API constraint (Spec §1): use the legacy NumPy interface throughout.
#   from pymdp.legacy.agent import Agent
#   from pymdp.legacy import utils, maths
# pymdp 1.x is JAX-first at the top level; the legacy module is the correct target for
# this workload (hundreds of independent small agents in a Python loop).

# EVERYTHING BELOW IS OPTIONAL, AND THAT IS THE POINT.
#
# `ghostscale/v1` through `v10` are closed: pre-specified, run, reported and left alone. The
# committed `uv.lock` fixes the dependency graph used by tested installs; long-term
# reproducibility still depends on Python and platform compatibility and the continued
# availability of upstream artifacts. Adding an information-theory library or a sensitivity-analysis
# library to the core dependency list would change what re-running a closed version MEANS, for
# the benefit of code that does not touch any of them.
#
# So the methodology layer is an extra, and `ghostscale/methods/` degrades gracefully: every
# module in it works without its backing library installed, and records `"skipped": "<pkg> not
# installed"` in the verdict rather than raising. A base install still reproduces every published
# number; a `[methods]` install additionally computes the new diagnostics.
[project.optional-dependencies]
# The measurement layer. Nothing here is required to reproduce a published result.
methods = [
    "dit>=1.5",          # exact discrete information theory; partial information decomposition
    "SALib>=1.5",        # Sobol / Morris global sensitivity analysis
    "pycatch22>=0.4",    # 22 canonical time-series features, C-compiled
    "statsmodels>=0.14", # multiple-testing correction (BH/BY), TOST equivalence tests
]
# Heavier and more exploratory: only needed for the trajectory-mining and Bayesian-check work.
explore = [
    "tsfresh>=0.20",     # exhaustive time-series feature extraction; superset of catch22
    "arviz>=0.18",       # posterior/predictive checking and diagnostics
    "dabest>=2023.2.14", # bootstrap estimation plots
]
# Test-time only.
dev = [
    "hypothesis>=6.100", # property-based and metamorphic tests
    "pytest",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ghostscale*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: reads a real experiment's output rather than re-simulating; skips until it exists",
]
